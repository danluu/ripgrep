# On Windows MSVC, statically link the C runtime so that the resulting EXE does
# not depend on the vcruntime DLL.
#
# See: https://github.com/BurntSushi/ripgrep/pull/1613
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Do the same for MUSL targets. At the time of writing (2023-10-23), this is
# the default. But the plan is for the default to change to dynamic linking.
# The whole point of MUSL with respect to ripgrep is to create a fully
# statically linked executable.
#
# See: https://github.com/rust-lang/compiler-team/issues/422
# See: https://github.com/rust-lang/compiler-team/issues/422#issuecomment-812135847
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
]

[env]
# Cargo resolves this relative to this file and exports an absolute path to
# dependency build scripts. The resulting rg binary only accelerates exact
# pattern/profile tuples listed in this manifest.
FRE_RIPGREP_AOT_PATTERNS_FILE = { value = "experiments/fre-patterns.tsv", relative = true }
# Match the mandatory Advanced SIMD/NEON capability of the Apple arm64 host.
# This controls AOT code generation, not runtime caching or dispatch.
FRE_RIPGREP_AOT_FEATURES = "asimd"
